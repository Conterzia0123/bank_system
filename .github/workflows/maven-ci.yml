name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      fail-fast: false # THÊM DÒNG NÀY ĐỂ GITHUB KHÔNG HỦY CÁC JOB CÒN LẠI KHI CÓ LỖI
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Thay đổi 'package' thành 'verify' để đảm bảo chạy qua pha kiểm tra của JaCoCo
    - name: Build and Verify with Maven
      run: mvn -B clean verify

    # Giữ lại action upload file .jar (nếu muốn)
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: bank-system-artifact-${{ matrix.os }} 
        path: target/*.jar
        retention-days: 5

    # BỔ SUNG: Trích xuất và lưu trữ báo cáo bao phủ code của JaCoCo
    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v4
      if: always() # Luôn upload báo cáo kể cả khi build bị fail do không đạt 80%
      with:
        name: jacoco-report-${{ matrix.os }}
        path: target/site/jacoco/
        retention-days: 5

    # Thêm step này để Bot tự động comment lỗi Checkstyle vào PR
    - name: Checkstyle Review
      uses: dbelyaev/action-checkstyle@master
      if: github.event_name == 'pull_request' # Chỉ chạy khi có Pull Request
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        level: warning