name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # 1. Khai báo chiến lược Matrix cho 3 hệ điều hành
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    # 2. Thay vì gán cứng (ví dụ: ubuntu-latest), ta truyền biến từ matrix vào
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B clean package

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        # Thêm biến matrix.os vào tên để tránh bị ghi đè artifact của nhau
        name: bank-system-artifact-${{ matrix.os }} 
        path: target/*.jar
        retention-days: 5